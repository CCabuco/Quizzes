{m:"Module 2.2.1: Gameplay",t:"Gameplay Definition",q:"What are 'payoffs' in the context of gameplay?",a:"The utility value assigned to a specific outcome — what the player gains from that result",c:["The final score shown at the end of a completed game session","Bonus rewards unlocked by completing in-game achievements","The utility value assigned to a specific outcome — what the player gains from that result","Items hidden throughout levels waiting to be discovered"]},
{m:"Module 2.2.1: Gameplay",t:"Gameplay Definition",q:"What is 'preference' in gameplay?",a:"The natural bias players have toward certain outcomes or utilities",c:["The setting that controls the game's difficulty level","The default controller configuration set by the developer","The natural bias players have toward certain outcomes or utilities","The graphical quality option the player selects in settings"]},
{m:"Module 2.2.1: Gameplay",t:"Gameplay Definition",q:"What does Sid Meier's quote 'a game is a series of interesting choices' mean?",a:"Every decision must have real trade-offs — no single obvious best answer should exist",c:["Games need as many options as possible to be engaging","Every decision must have real trade-offs — no single obvious best answer should exist","Players must be presented with choices constantly and without rest","Games need a branching story structure to function properly"]},
{m:"Module 2.2.1: Gameplay",t:"Dominant Strategy",q:"What is a 'dominated strategy'?",a:"An option that is never worth choosing under any circumstance",c:["A strategy that is only useful against weak or inexperienced opponents","The default option that most beginners tend to choose first","An option that is never worth choosing under any circumstance","A risky high-reward tactic with a very high associated cost"]},
{m:"Module 2.2.1: Gameplay",t:"Dominant Strategy",q:"What is a 'dominant strategy'?",a:"An option so superior that choosing anything else is never worthwhile — making all other options irrelevant",c:["The most popular strategy among experienced expert players","A strategy that performs well in most but not all situations","An option so superior that choosing anything else is never worthwhile — making all other options irrelevant","A guaranteed winning method that only works a single time"]},
{m:"Module 2.2.1: Gameplay",t:"Dominant Strategy",q:"Why is having a dominant strategy bad for a game?",a:"It renders all other options worthless, wasting development effort and eliminating interesting choices",c:["It makes the game too simple and boring for beginners","It confuses players who are new to the game's genre","It renders all other options worthless, wasting development effort and eliminating interesting choices","It causes experienced players to abandon multiplayer modes"]},
{m:"Module 2.2.1: Gameplay",t:"Dominant Strategy",q:"Why is a dominated strategy also a problem in game design?",a:"No one will ever use it — the time and resources spent building it were completely wasted",c:["It creates an unfair advantage for experienced players","It makes the game harder to balance in future updates","No one will ever use it — the time and resources spent building it were completely wasted","It causes the AI to make consistently poor decisions"]},
{m:"Module 2.2.1: Gameplay",t:"Near Dominance",q:"What is a 'near-dominated option'?",a:"An option only useful in very specific or narrow circumstances",c:["An option slightly weaker than the current best available choice","An option that only performs well against inexperienced players","An option only useful in very specific or narrow circumstances","A hidden option unlocked only after completing the game"]},
{m:"Module 2.2.1: Gameplay",t:"Near Dominance",q:"What is a 'near-dominant option'?",a:"An option players will use most of the time because it performs well in almost every situation",c:["An option that only activates during specific in-game events","The rarest and most difficult option to unlock in the game","An option players will use most of the time because it performs well in almost every situation","An option that is only slightly better in multiplayer modes"]},
{m:"Module 2.2.1: Gameplay",t:"Near Dominance",q:"Why is identifying near-dominance valuable for designers?",a:"It reveals which options get used most — so those options deserve the most visual and effects investment",c:["It helps designers decide which options should be removed","It tells designers how to price additional downloadable content","It reveals which options get used most — so those options deserve the most visual and effects investment","It identifies which levels require the most playtesting time"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What are 'strategic choices' in gameplay?",a:"Decisions that shape the game's direction over the medium or long term with cascading effects on future options",c:["Quick decisions made during intense real-time combat","Cosmetic selections that change only a character's appearance","Decisions that shape the game's direction over the medium or long term with cascading effects on future options","Story choices that only affect which ending the player receives"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What are 'supporting investments' in gameplay?",a:"Expenditures that work indirectly toward the main goal by enabling future progress rather than achieving it directly",c:["Resources spent exclusively on cosmetic character upgrades","Health items and power-ups collected during level exploration","Expenditures that work indirectly toward the main goal by enabling future progress rather than achieving it directly","Bonuses rewarded specifically for completing optional side objectives"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What makes 'versatility' a valuable property in a gameplay option?",a:"It is useful across a wide range of situations — helpful for beginners and still relevant for experts",c:["It deals the highest possible damage output in combat","It is the cheapest option available for the player to purchase","It is useful across a wide range of situations — helpful for beginners and still relevant for experts","It unlocks additional abilities each time it is used repeatedly"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What do 'compensating factors' ensure in game design?",a:"That every option has both an upside and a downside — preventing any single choice from dominating",c:["That players who are losing receive automatic bonus resources","That the AI adjusts the difficulty automatically over time","That every option has both an upside and a downside — preventing any single choice from dominating","That all characters level up at exactly the same rate"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What is 'impermanence' as a gameplay design tool?",a:"Advantages or disadvantages that are temporary — they can expire, be stolen, run out, or be destroyed",c:["A game mode where all progress resets after every session","A design approach that makes the game shorter and easier","Advantages or disadvantages that are temporary — they can expire, be stolen, run out, or be destroyed","A mechanic that prevents players from collecting or hoarding items"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What are 'shadow costs'?",a:"The full real cost of reaching a game choice — including everything sacrificed along the way, not just the direct price",c:["Hidden penalties applied automatically when the player fails a mission","Costs that only appear and are visible in the game's advanced settings","The full real cost of reaching a game choice — including everything sacrificed along the way, not just the direct price","Fees charged by the developer for accessing premium in-game content"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What are 'synergies' in the context of gameplay strategy?",a:"Interactions between strategic elements where combinations produce results better or worse than using each alone",c:["Cooperative multiplayer mechanics that reward coordinated teamwork","Special moves that are unlocked when two characters fight together","Interactions between strategic elements where combinations produce results better or worse than using each alone","Bonus points triggered automatically when completing levels without dying"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What is 'economies of scale' as a type of positive synergy?",a:"Having more units of the same type makes each individual unit more effective",c:["Spending more resources produces proportionally greater output","Having more units of the same type makes each individual unit more effective","Combining different unit types together unlocks special combined abilities","Producing resources at a faster rate the longer the game session continues"]},
{m:"Module 2.2.1: Gameplay",t:"Toolbox of Interesting Choices",q:"What is 'diseconomies of scope' as a type of negative synergy?",a:"Mixed forces must move at the pace of the slowest — a focused approach can outperform a diverse one",c:["Using too many different strategies simultaneously causes overall confusion","Having too many unit types reduces the overall effectiveness of the army","Mixed forces must move at the pace of the slowest — a focused approach can outperform a diverse one","Combining abilities together cancels out their individual positive effects"]},

{m:"Module 2.3: Game Balance",t:"Player/Player Balance",q:"What is 'player/player balance'?",a:"Ensuring no player gains an unfair advantage beyond what their skill alone earns them",c:["Making sure all players start every match with identical loadouts","Ensuring no player gains an unfair advantage beyond what their skill alone earns them","Matching players together by age or experience level in online modes","Giving disadvantaged players automatic bonus starting resources"]},
{m:"Module 2.3: Game Balance",t:"Player/Player Balance",q:"What is the golden rule of player/player balance?",a:"A player should never end up in an unwinnable position through no fault of their own",c:["All players must begin every match with the exact same resources","Luck must be completely and entirely eliminated from all competition","A player should never end up in an unwinnable position through no fault of their own","Every match must have an equal statistical chance of any possible outcome"]},
{m:"Module 2.3: Game Balance",t:"Player/Player Balance",q:"What is 'symmetry' in the context of player/player balance?",a:"All players having identical weapons, hit points, and level layouts — eliminating positional or gear advantages",c:["The visual design of a game level being mirrored left and right","Alternating which player takes the first action each round","All players having identical weapons, hit points, and level layouts — eliminating positional or gear advantages","Matching the exact number of players on each competing team"]},
{m:"Module 2.3: Game Balance",t:"Player/Player Balance",q:"What is 'just broken symmetry'?",a:"Slight asymmetry that is easier to compensate for than total asymmetry — keeping the game interesting without losing fairness",c:["A technical glitch that causes the game to behave in unexpected ways","Removing all symmetry entirely from a multiplayer map design","Slight asymmetry that is easier to compensate for than total asymmetry — keeping the game interesting without losing fairness","Intentionally making one faction slightly more powerful than others"]},
{m:"Module 2.3: Game Balance",t:"Player/Gameplay Balance",q:"What is 'player/gameplay balance'?",a:"Matching the difficulty curve to the player's learning pace so the gameplay never becomes the enemy",c:["Keeping controls simple enough for any type of player to learn","Matching the difficulty curve to the player's learning pace so the gameplay never becomes the enemy","Limiting how long any single player can play per gaming session","Balancing the number of enemies present in each individual level"]},
{m:"Module 2.3: Game Balance",t:"Player/Gameplay Balance",q:"What is the golden rule of player/gameplay balance?",a:"The game should become more fun the more skilled and experienced the player becomes",c:["Every player should be able to complete the game regardless of skill","The tutorial must comprehensively cover every single mechanic","The game should become more fun the more skilled and experienced the player becomes","Difficulty must gradually decrease over time to maintain player engagement"]},
{m:"Module 2.3: Game Balance",t:"Player/Gameplay Balance",q:"What does 'reward the player' mean in player/gameplay balance?",a:"Offset the frustration of learning mistakes by rewarding correct actions in ways that open new possibilities",c:["Automatically give players bonus lives after every death they experience","Show congratulatory cutscenes after every completed objective","Offset the frustration of learning mistakes by rewarding correct actions in ways that open new possibilities","Automatically reduce the difficulty setting after repeated failures"]},
{m:"Module 2.3: Game Balance",t:"Player/Gameplay Balance",q:"What does 'let the machine do the work' mean in game design?",a:"Automate tedious tasks that are not fun — the computer should free the player to focus on meaningful decisions",c:["Let the AI play through sections that are too difficult","Automate tedious tasks that are not fun — the computer should free the player to focus on meaningful decisions","Use procedural generation for all game content and levels","Allow the game to automatically patch and update itself"]},
{m:"Module 2.3: Game Balance",t:"Player/Gameplay Balance",q:"What does 'make a game you play with, not against' mean?",a:"Players should succeed through skill and judgment — not by memorizing arbitrary trial-and-error sequences",c:["Games should always be cooperative rather than competitive","Players should be able to win on their very first attempt","Players should succeed through skill and judgment — not by memorizing arbitrary trial-and-error sequences","Games should automatically adapt to each individual player's strategy"]},
{m:"Module 2.3: Game Balance",t:"Gameplay/Gameplay Balance",q:"What is 'gameplay/gameplay balance'?",a:"Ensuring no single game feature is so powerful that all other features become irrelevant",c:["Making every level take exactly the same amount of time to complete","Ensuring no single game feature is so powerful that all other features become irrelevant","Keeping the total story length equal to the total gameplay length","Making sure every weapon in the game deals the same amount of damage"]},
{m:"Module 2.3: Game Balance",t:"Gameplay/Gameplay Balance",q:"What is the golden rule of gameplay/gameplay balance?",a:"Every option must be worth using at some point — its cost must be proportional to its payoff",c:["All characters must have exactly identical base statistics","Weapons must appear and be available at equal frequency","Every option must be worth using at some point — its cost must be proportional to its payoff","All levels must offer the exact same number of strategic choices"]},
{m:"Module 2.3: Game Balance",t:"Gameplay/Gameplay Balance",q:"What is 'component balance'?",a:"Balancing the relative values of game choices against each other — for example cost versus strength",c:["Ensuring the game performs consistently well on all hardware types","Making all game levels perfectly equal in length and difficulty","Balancing the relative values of game choices against each other — for example cost versus strength","Matching the production quality of graphics to the quality of sound"]},
{m:"Module 2.3: Game Balance",t:"Gameplay/Gameplay Balance",q:"What is 'attribute balance'?",a:"Balancing how game choices interact with each other — not just their individual standalone values",c:["Adjusting character appearance attributes to be visually equal","Making visible statistics always perfectly accurate to actual performance","Balancing how game choices interact with each other — not just their individual standalone values","Ensuring all attributes are unlocked by the player at exactly the same rate"]},
{m:"Module 2.3: Game Balance",t:"Gameplay/Gameplay Balance",q:"What is 'chrome' in gameplay design terms?",a:"Choices that make little practical difference either way — valid but not strategically meaningful",c:["A visual rendering style applied to game environments and assets","An anti-cheat detection system used in online competitive games","Choices that make little practical difference either way — valid but not strategically meaningful","A term for extra downloadable content added after the game launches"]},

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
const questions=ALL_Q;
let current=0,score=0,answered=false;

function render(){
  if(current>=questions.length){showScore();return;}
  const q=questions[current];
  document.getElementById('q-counter').textContent=`Question ${current+1} of ${questions.length}`;
  document.getElementById('module-label').textContent=q.m;
  document.getElementById('topic-tag').textContent=q.t;
  document.getElementById('question').textContent=q.q;
  document.getElementById('progress-bar').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('feedback').textContent='';
  document.getElementById('next-btn').style.display='none';
  answered=false;
  const div=document.getElementById('choices');
  div.innerHTML='';
  shuffle([...q.c]).forEach(c=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.textContent=c;
    btn.onclick=()=>handleAnswer(c,q.a,btn);
    div.appendChild(btn);
  });
}

function handleAnswer(chosen,correct,btn){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct)b.classList.add('correct');
  });
  if(chosen===correct){
    score++;
    document.getElementById('feedback').style.color='var(--text-success)';
    document.getElementById('feedback').textContent='Correct!';
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').style.color='var(--text-danger)';
    document.getElementById('feedback').textContent='Incorrect.';
  }
  document.getElementById('next-btn').style.display='inline-block';
}

function showScore(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('score-screen').style.display='block';
  const pct=Math.round((score/questions.length)*100);
  document.getElementById('score-title').textContent=`You got ${score} out of ${questions.length} (${pct}%)`;
  let msg='';
  if(pct>=90)msg='Excellent! You really know your material.';
  else if(pct>=75)msg='Good job! A bit more review and you will be ready.';
  else if(pct>=50)msg='Not bad — keep studying the slides.';
  else msg='Keep going — review and try again!';
  document.getElementById('score-sub').textContent=msg;
}

document.getElementById('next-btn').onclick=()=>{current++;render();};
document.getElementById('retry-btn').onclick=()=>{
  current=0;score=0;answered=false;
  document.getElementById('score-screen').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
};
render();
